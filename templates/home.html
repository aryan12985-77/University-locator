<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Campus Navigator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="home-page">

  <!-- TOP BAR -->
  <div class="top-bar a1">
    <a class="logo" href="/">
      <div class="logo-icon">🧭</div>
      <span>Campus Navigator</span>
    </a>
    <div style="font-size:0.75rem; color:var(--text-muted);">POORNIMA UNIVERSITY</div>
  </div>

  <!-- HERO -->
  <div class="hero">

    <div class="hero-badge a1">🎓 Smart Campus Guide</div>

    <h1 class="a2">Find Any Place<br>On Campus</h1>

    <p class="a3">Search for classrooms, offices, labs, canteen and more — get step-by-step directions instantly.</p>

    <!-- SEARCH -->
    <div class="search-outer a4">
      <div class="search-card glass">
        <span class="s-icon">🔍</span>
        <input
          type="text"
          id="homeSearch"
          placeholder="Search a place, building, or lab..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button class="search-btn" onclick="goToResults()">Search</button>
      </div>
      <div id="homeSuggestions"></div>
    </div>

    <!-- CATEGORY CHIPS -->
    <div class="categories a4">
      <div class="cat-chip" onclick="quickSearch('Cricket Ground')">⚽ Sports</div>
      <div class="cat-chip" onclick="quickSearch('Canteen')">🍽 Canteen</div>
      <div class="cat-chip" onclick="quickSearch('Library')">📚 Library</div>
      <div class="cat-chip" onclick="quickSearch('Medical')">🏥 Medical</div>
      <div class="cat-chip" onclick="quickSearch('Admin')">🏛 Admin</div>
      <div class="cat-chip" onclick="quickSearch('Parking')">🚗 Parking</div>
    </div>

    <!-- STATS -->
    <div class="stats-bar a5">
      <div class="stat"><div class="num">50+</div><div class="lbl">Locations</div></div>
      <div class="stat"><div class="num">10+</div><div class="lbl">Buildings</div></div>
      <div class="stat"><div class="num">Live</div><div class="lbl">GPS Routing</div></div>
    </div>

  </div>

</div>

<script>
const input = document.getElementById("homeSearch");
const box   = document.getElementById("homeSuggestions");

input.addEventListener("input", function () {
  const q = input.value.trim();
  if (!q) { box.style.display = "none"; box.innerHTML = ""; return; }

  fetch("/suggest?q=" + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      box.innerHTML = "";
      if (!data || data.length === 0) {
        box.style.display = "block";
        box.innerHTML = "<div class='sug-item'><span class='sug-ic'>⚠️</span> No results found</div>";
        return;
      }
      box.style.display = "block";
      data.forEach(item => {
        const d = document.createElement("div");
        d.className = "sug-item";
        d.innerHTML = "<span class='sug-ic'>📍</span>" + item;
        d.onclick = () => { window.location = "/directions?q=" + encodeURIComponent(item); };
        box.appendChild(d);
      });
    })
    .catch(() => { box.style.display = "none"; });
});

function goToResults() {
  const val = input.value.trim();
  if (val) window.location = "/directions?q=" + encodeURIComponent(val);
}

function quickSearch(term) {
  input.value = term;
  window.location = "/directions?q=" + encodeURIComponent(term);
}

input.addEventListener("keypress", e => { if (e.key === "Enter") goToResults(); });

document.addEventListener("click", e => {
  if (!document.querySelector(".search-outer").contains(e.target)) {
    box.style.display = "none";
  }
});
</script>
</body>
</html>
