<!DOCTYPE html>
<html lang="en">
<head>
<!-- Maintenance: this page is the full-screen map shell; map behavior lives in static/js/map.js. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Map — Campus Navigator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 1C9.4 1 4 6.4 4 13c0 8.6 12 19 12 19s12-10.4 12-19c0-6.6-5.4-12-12-12z' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23fff' opacity='.95'/%3E%3Ccircle cx='16' cy='10.5' r='2' fill='url(%23g)'/%3E%3Cline x1='16' y1='12.5' x2='16' y2='17' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='14.5' x2='13.5' y2='16.5' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='14.5' x2='18.5' y2='16.5' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='14' y1='17' x2='12.5' y2='19.5' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='18' y1='17' x2='19.5' y2='19.5' stroke='%234f46e5' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="map-page">

  <!-- TOP BAR -->
  <div class="top-bar">
    <a class="logo" href="/">
      <div class="logo-icon-wrap">
        <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="17" fill="url(#lgm)" opacity="0.15"/>
          <path d="M18 4C12 4 7 9 7 15c0 9 11 17 11 17s11-8 11-17c0-6-5-11-11-11z" fill="url(#lgm)"/>
          <circle cx="18" cy="15" r="4.5" fill="white" opacity="0.9"/>
          <circle cx="18" cy="13" r="1.5" fill="url(#lgm)"/>
          <line x1="18" y1="14.5" x2="18" y2="18" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="18" y1="16" x2="15.8" y2="18" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="18" y1="16" x2="20.2" y2="18" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round"/>
          <defs>
            <linearGradient id="lgm" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span>Campus Navigator</span>
    </a>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="/directions?q={{ destination | urlencode }}" class="btn-secondary" style="padding:8px 14px;font-size:0.78rem;border-radius:50px;">
        ← Directions
      </a>
      <a href="/" class="btn-secondary" style="padding:8px 14px;font-size:0.78rem;border-radius:50px;">
        🔍 New Search
      </a>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-full-container">
    <div id="map"></div>

    <!-- Map HUD: status and base-map controls are wired in map.js. -->
    <div class="map-hud">
      <div class="map-status-pill"><span class="status-live-dot"></span><span id="accuracyReadout">GPS ready</span></div>
      <button class="map-style-btn" id="mapStyleBtn" data-mode="satellite">◈ Street</button>
    </div>

    <!-- Compass is sensor-driven; it remains available even when GPS is unavailable. -->
    <div class="map-compass-control">
      <button class="compass-btn" id="compassBtn" title="Orient map to your direction">N</button>
      <span id="headingReadout">—</span>
    </div>

    <!-- Locate FAB -->
    <button class="locate-fab" onclick="locateUser()" title="My Location"><span class="locate-glyph">⌖</span></button>

    <!-- Floating info panel (populated by JS) -->
    <div class="glass floating-info" id="floatingInfo" style="display:none;">
      <div class="fi-title" id="fiTitle">—</div>
      <div class="fi-meta"  id="fiMeta">—</div>
      <div class="fi-row">
        <a href="/" class="btn-secondary" style="padding:8px 14px;font-size:0.78rem;">🔍 New Search</a>
        <button class="btn-primary" onclick="locateUser()" style="padding:8px 14px;font-size:0.78rem;">📍 My Route</button>
      </div>
    </div>
  </div>

</div>

<script>var destination = {{ destination | tojson }};</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>

</body>
</html>
